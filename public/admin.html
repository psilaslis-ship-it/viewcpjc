<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de Exibição</title><link rel="stylesheet" href="/admin.css"><script src="/socket.io/socket.io.js"></script><script src="/common.js"></script></head><body><header><div><h1>Painel de Exibição</h1><p>VGA e HDMI são saídas independentes</p></div><span id="status">conectando…</span></header><nav><button data-tab="clock" class="active">Contador · VGA</button><button data-tab="hdmi">Conteúdo · HDMI</button><button data-tab="routes">Rotas Holyrics</button></nav><main>
<section id="clock" class="tab active"><h2>Contador digital</h2><div class="time" id="clockPreview">00:00:00</div><div class="actions"><button id="start">Iniciar</button><button id="pause">Pausar</button><button id="reset" class="danger">Reiniciar</button></div><label>Cor dos dígitos <input id="clockColor" type="color"></label><label>Fundo <input id="clockBg" type="color"></label><label>Fonte <select id="font"><option value="digital">Digital (relógio)</option><option value="mono">Monoespaçada</option></select></label><label><input id="tenths" type="checkbox"> Exibir décimos</label></section>
<section id="hdmi" class="tab"><h2>Conteúdo HDMI</h2><div class="grid"><button id="modeMessage">Mensagem</button><button id="modeUpload">Imagem ou vídeo</button><button id="modeHolyrics">Holyrics</button></div><form id="messageForm"><label>Mensagem <input name="message" placeholder="Aguardando conteúdo"></label><button>Exibir mensagem</button></form><form id="uploadForm" hidden><label>Arquivo <input name="file" type="file" accept="image/*,video/*" required></label><label>Ajuste <select name="fit"><option value="contain">Sem cortar</option><option value="cover">Preencher tela</option></select></label><button>Enviar e reproduzir</button></form><form id="holyricsForm" hidden><label>Rota <select name="url" id="routeSelect"></select></label><button>Exibir Holyrics agora</button></form></section>
<section id="routes" class="tab"><h2>Rotas do Holyrics</h2><p>Cadastre a URL que o Holyrics publica. A alteração é refletida imediatamente no HDMI.</p><form id="routeForm"><label>Nome <input name="name" required maxlength="80"></label><label>URL <input name="url" type="url" placeholder="http://IP:porta/view/widescreen" required></label><button>Adicionar rota</button></form><ul id="routeList"></ul></section>
</main><div id="toast" role="status"></div><script src="/admin.js"></script></body></html>
