<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player HDMI</title><link rel="stylesheet" href="/displays.css"><script src="/socket.io/socket.io.js"></script><script src="/common.js"></script></head><body class="hdmi-body"><main id="stage"></main><script>
let previous='';
function render(h){const key=JSON.stringify(h);if(key===previous)return;previous=key;const stage=document.querySelector('#stage');stage.replaceChildren();if(h.mode==='image'){const el=new Image();el.src=h.source;el.style.objectFit=h.fit;stage.append(el)}else if(h.mode==='video'){const el=document.createElement('video');el.src=h.source;el.autoplay=true;el.loop=true;el.muted=true;el.playsInline=true;el.style.objectFit=h.fit;stage.append(el);el.play().catch(()=>{})}else if(h.mode==='holyrics'){const el=document.createElement('iframe');el.src='/holyrics?url='+encodeURIComponent(h.source);el.allow='autoplay';stage.append(el)}else {const el=document.createElement('div');el.className='message';el.textContent=h.message||'Aguardando conteúdo';stage.append(el)}}
addEventListener('display-state',e=>render(e.detail.hdmi));
</script></body></html>
